# PLAN §11.3 — licence allowlist (GPL-3.0 project with a GPL mpv build).
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Reviewed 2026-11-20. Unmaintained notices with no safe upgrade, all transitive:
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk-rs 0.18 macros (tauri/wry Linux stack); no upgrade until tauri moves to gtk4" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (keyring secret-service, logind watcher); folded into zbus upstream, revisit on zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5; see RUSTSEC-2026-0370" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5; see RUSTSEC-2026-0370" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice; used for UTC/tz math in core and by deps; migrate to jiff post-1.0 (tracked)" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained notice; same migration as chrono" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
