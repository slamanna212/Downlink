[package]
name = "downlink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Downlink desktop shell (Tauri 2)"

[lints]
workspace = true

[features]
# Embed the frontend (release behaviour). The spike build uses it with TAURI_CONFIG pointing
# `frontendDist` at ./spike; see spike/run.sh.
custom-protocol = ["tauri/custom-protocol"]
spike = ["custom-protocol"]
# Developer end-to-end driver (src/e2e.rs); never part of release builds.
e2e = []

[dependencies]
tempfile = "3"
downlink-player = { path = "../../crates/downlink-player" }
downlink-platform = { path = "../../crates/downlink-platform" }
downlink-core = { path = "../../crates/downlink-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
