# Quality gates from CLAUDE.md / PLAN §11.3, on every PR and push to main.
name: CI

# Pushes to main are gated by release.yml, which calls this workflow first (workflow_call),
# so CI runs exactly once per push and a red main never publishes.
on:
  # Automatic triggers are paused until the app is further along (Sam, 2026-11-19).
  # Re-enable by restoring `pull_request:`.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Node 22 LTS, pnpm 10 (PLAN §11.1). pnpm-lock.yaml is lockfileVersion 9.0, which pnpm 9 and 10 both read.
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies (PLAN §13.2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libmpv-dev ffmpeg pkg-config build-essential xvfb

      # Reads rust-toolchain.toml (pinned channel, clippy, rustfmt) and caches cargo via Swatinem/rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      # The UI must exist before the desktop crate compiles (tauri frontendDist = ../ui/dist).
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/ui build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny check
      - name: cargo nextest
        run: cargo nextest run --workspace --no-tests=warn

  ui:
    name: UI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/ui lint
      - run: pnpm -C apps/ui typecheck
      - run: pnpm -C apps/ui test
      - run: pnpm -C apps/ui build

  workflows:
    name: Lint workflows and scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: shellcheck release scripts
        run: shellcheck tools/release/*.sh
