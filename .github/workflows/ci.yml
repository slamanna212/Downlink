name: CI

# Quality gates (CLAUDE.md / PLAN §11.3), Linux only: the Windows release build is the Windows compile check.
# Reusable: called by pr-ci.yml (PRs to dev), release.yml and dev-build.yml (before building). Also runnable by hand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      linux-runner:
        description: Runner label for the Linux legs.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Node 24 LTS, pnpm 10 (PLAN §11.1). pnpm-lock.yaml is lockfileVersion 9.0, which pnpm 9 and 10 both read.
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  rust:
    name: Rust
    runs-on: ${{ inputs.linux-runner || 'ubuntu-24.04' }}
    # Same image as the libmpv build (MPV_LINUX_IMAGE in tools/mpv/pins.env; the libmpv-linux action checks
    # they match), so the tests load exactly the libmpv the release bundles.
    container: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq zstd xz-utils file patchelf pkg-config build-essential \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg xvfb \
            libpipewire-0.3-0t64 libva-wayland2
          # ^ the bundle takes these from the user's desktop (see tools/mpv/linux.sh); a bare container lacks them.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/libmpv-linux
        with:
          image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6

      # Reads rust-toolchain.toml (pinned channel, clippy, rustfmt) and caches cargo via Swatinem/rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: ". -> target"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest,cargo-deny

      # The UI must exist before the desktop crate compiles (tauri frontendDist = ../ui/dist).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/ui build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check
      - name: cargo nextest
        env:
          # libmpv tests fail (not skip) when the staged engine cannot be loaded.
          DOWNLINK_REQUIRE_MPV: "1"
        run: |
          # $GITHUB_WORKSPACE, not github.workspace: inside a container only the former is the real path.
          export DOWNLINK_MPV_PATH="$GITHUB_WORKSPACE/tools/mpv/out/linux/lib/libmpv.so.2"
          cargo nextest run --workspace --no-tests=warn

  ui:
    name: UI
    runs-on: ${{ inputs.linux-runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/ui lint
      - run: pnpm -C apps/ui typecheck
      - run: pnpm -C apps/ui test
      - run: pnpm -C apps/ui build

  workflows:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: shellcheck release and libmpv scripts
        run: shellcheck tools/release/*.sh tools/mpv/*.sh
