# Reusable build + publish pipeline (PLAN §10), called by release.yml (main, stable) and dev-build.yml
# (manual, dev channel). Creates a draft release, builds Windows, Linux and macOS (Apple Silicon) in parallel,
# writes latest.json, then publishes (dev) or leaves the draft for a manual publish (stable). See docs/release.md.
name: Build and publish

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-pre), injected into tauri.conf.json/Cargo/ui at build time.
        type: string
        required: true
      tag:
        type: string
        required: true
      prerelease:
        description: Mark the release as a GitHub pre-release.
        type: boolean
        default: false
      channel:
        description: "stable (draft, published by hand) or dev (published straight away, refreshes the dev-channel latest.json)."
        type: string
        default: stable
      linux-runner:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      signed: ${{ steps.meta.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # git-cliff needs history and tags

      - id: meta
        name: Detect updater signing key
        env:
          CHANNEL: ${{ inputs.channel }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANNEL" == stable ]]; then
            echo "::error::Stable releases require the updater signing key."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::TAURI_SIGNING_PRIVATE_KEY is not set. Installers are published, but without updater signatures or latest.json, so in-app updates will not work. See docs/release.md."
          fi

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff

      - name: Generate release notes (git-cliff)
        run: |
          git cliff --unreleased --tag "${{ inputs.tag }}" --strip header -o notes.md
          [ -s notes.md ] || echo "No user-visible changes." > notes.md

      - id: create
        name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # The callers already checked that the release does not exist; clear any stale draft from a failed run.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # Take the id from the create response. Looking the new draft up by tag in the releases list returns
          # nothing for drafts, which left releaseId blank and made tauri-action skip every upload.
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$TAG" -f target_commitish="$(git rev-parse HEAD)" -f name="$TAG" \
                 -F body=@notes.md -F draft=true -F prerelease="$PRERELEASE" --jq .id)"
          if [[ -z "$id" ]]; then echo "::error::release create returned no id"; exit 1; fi
          echo "Created draft release $TAG (id $id)"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build-windows:
    name: Build (Windows NSIS)
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage libmpv (pinned in tools/mpv/pins.env)
        shell: pwsh
        run: ./tools/mpv/windows.ps1 -OutDir tools/mpv/out/windows/mpv

      - uses: ./.github/actions/setup-build
        with:
          channel-version: ${{ inputs.version }}
          signed: "false"
          overlay: windows

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          args: --bundles nsis --config ${{ github.workspace }}/release-config.json
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false # publish writes the one latest.json; two jobs uploading their own race

  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux AppImage, deb)
    needs: prepare
    # Built in the libmpv pin's image (MPV_LINUX_IMAGE, tools/mpv/pins.env): Debian 13 sets the floor
    # (glibc 2.41, Wayland 1.23), the same image CI tests in. LINUX_RUNNER picks the host (needs Docker).
    runs-on: ${{ inputs.linux-runner }}
    container: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    permissions:
      contents: write
    env:
      # linuxdeploy/appimagetool are AppImages themselves; there is no FUSE in a container.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq zstd xz-utils file patchelf pkg-config build-essential gh \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libva2 libva-drm2 libva-wayland2 libva-x11-2 libvdpau1 libpipewire-0.3-0t64 libxss1 libxv1 \
            libasound2t64 libpulse0 libvulkan1
          # ^ host-stack libs the bundled libmpv links against but tools/mpv/linux.sh leaves out (the user's
          #   desktop provides them). linuxdeploy ldd-walks usr/lib and aborts on any unresolved dependency, and
          #   on a libmpv cache hit build-linux.sh never runs, so nothing else installs them.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/libmpv-linux
        with:
          image: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6

      - uses: ./.github/actions/setup-build
        with:
          channel-version: ${{ inputs.version }}
          signed: "false"
          overlay: linux

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          # Relative to projectPath: inside a container github.workspace is the host path, not ours.
          args: --bundles appimage,deb --config ../../release-config.json
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false # publish writes the one latest.json; two jobs uploading their own race

  # ---------------------------------------------------------------------------
  build-macos:
    name: Build (macOS Apple Silicon dmg)
    needs: prepare
    runs-on: macos-15 # arm64
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unsigned output of tools/mpv/macos.sh, saved straight after the build so a later failure in this job does
      # not throw away a ~20 min libmpv build. The signing step below re-signs it on every run.
      - id: libmpv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/mpv/out/macos
          key: libmpv-macos-arm64-${{ hashFiles('tools/mpv/pins.env', 'tools/mpv/macos.sh', 'tools/mpv/patches/**') }}

      - name: Build libmpv (cache miss)
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkgconf
          ./tools/mpv/macos.sh tools/mpv/out/macos

      - if: steps.libmpv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tools/mpv/out/macos
          key: ${{ steps.libmpv.outputs.cache-primary-key }}

      # Developer ID signing + notarisation need all five Apple secrets (docs/release.md). With none of them the
      # build is ad-hoc signed and testers must clear the quarantine flag; a partial set is a configuration error.
      - id: apple
        name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          have=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY; do
            [[ -n "${!v}" ]] && have=$((have + 1))
          done
          if [[ "$have" == 0 ]]; then
            { echo "signed=false"; echo "identity=-"; } >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::The Apple signing secrets are not set, so the macOS build is ad-hoc signed and not notarised. Testers must run xattr -dr com.apple.quarantine /Applications/Downlink.app once. See docs/release.md."
            exit 0
          fi
          if [[ "$have" != 5 ]]; then
            echo "::error::Only $have of the 5 Apple secrets are set (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_PRIVATE_KEY)."
            exit 1
          fi

          # Throwaway keychain with a random password, first in the search list so codesign finds the identity.
          keychain="$RUNNER_TEMP/downlink-signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing keychain list is a word list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
                      | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n1)"
          if [[ -z "$identity" ]]; then
            echo "::error::APPLE_CERTIFICATE holds no 'Developer ID Application' identity (an Apple Development or Apple Distribution certificate will not do)."
            exit 1
          fi
          echo "Signing as: $identity"

          # The App Store Connect API key tauri notarises with.
          key="$RUNNER_TEMP/AuthKey_notary.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
          { echo "signed=true"; echo "identity=$identity"; echo "api_key_path=$key"; } >> "$GITHUB_OUTPUT"

      # Sign libmpv ourselves before bundling: notarisation rejects any Mach-O without a Developer ID signature,
      # hardened runtime and a secure timestamp, and the bundler is not relied on to sign Contents/Frameworks.
      - name: Sign libmpv
        env:
          IDENTITY: ${{ steps.apple.outputs.identity }}
        run: |
          lib=tools/mpv/out/macos/Frameworks/libmpv.2.dylib
          if [[ "$IDENTITY" == "-" ]]; then
            codesign --force --sign - "$lib"
          else
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$lib"
          fi
          codesign --verify --strict --verbose=2 "$lib"

      - uses: ./.github/actions/setup-build
        with:
          channel-version: ${{ inputs.version }}
          signed: "false"
          overlay: macos

      - name: Set the signing identity
        env:
          IDENTITY: ${{ steps.apple.outputs.identity }}
        run: |
          jq --arg id "$IDENTITY" '.bundle.macOS.signingIdentity = $id' release-config.json > "$RUNNER_TEMP/rc.json"
          mv "$RUNNER_TEMP/rc.json" release-config.json

      # tauri signs the app with the hardened runtime, notarises it with the API key, and staples the ticket.
      - name: Build, sign and notarise
        working-directory: apps/desktop
        env:
          SIGNED: ${{ steps.apple.outputs.signed }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
        run: |
          if [[ "$SIGNED" == true ]]; then
            export APPLE_API_ISSUER="$NOTARY_ISSUER" APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_KEY_PATH="$NOTARY_KEY_PATH"
          fi
          cargo tauri build --bundles app,dmg --config ../../release-config.json

      # Also proves the hardened-runtime app can load its bundled libmpv (library validation) and play a frame.
      - name: Verify the app
        env:
          SIGNED: ${{ steps.apple.outputs.signed }}
        run: |
          app=target/release/bundle/macos/Downlink.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          if [[ "$SIGNED" == true ]]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi
          exe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -n1)"
          DOWNLINK_REQUIRE_BUNDLED=1 "$exe" --self-test

      # The updater archive is made here rather than by tauri: updater signing happens in publish, away from the
      # build (createUpdaterArtifacts is off in every build job).
      - name: Upload the dmg and the updater archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          cd target/release/bundle
          dmgs=(dmg/*_aarch64.dmg)
          [[ ${#dmgs[@]} == 1 && -s "${dmgs[0]}" ]] || { echo "::error::expected one *_aarch64.dmg, got: ${dmgs[*]}"; exit 1; }
          archive="Downlink_${VERSION}_aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C macos Downlink.app
          gh release upload "$TAG" --clobber -- "${dmgs[0]}" "$archive"

  # ---------------------------------------------------------------------------
  publish:
    name: Publish (latest.json)
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      SIGNED: ${{ needs.prepare.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release assets
        run: |
          mkdir assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "assets/$name"
          done
          ls -l assets

      - name: Install updater signer
        if: needs.prepare.outputs.signed == 'true'
        run: cargo install tauri-cli --version '=2.12.6' --locked
        env:
          GH_TOKEN: ""

      - name: Sign and upload updater signatures
        if: needs.prepare.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for asset in assets/*_x64-setup.exe assets/*_amd64.AppImage assets/*_amd64.deb assets/*_aarch64.app.tar.gz; do
            test -s "$asset"
            cargo tauri signer sign --app-version "$VERSION" "$asset"
            test -s "$asset.sig"
          done
          gh release upload "$TAG" --clobber -- assets/*.sig

      # The notes in latest.json are the draft's notes for now; release-notes.yml replaces them with the final
      # release text when you publish (or later edit) the release, so the in-app "What's new" matches GitHub.
      - name: Build and upload latest.json
        if: needs.prepare.outputs.signed == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > notes.md
          python3 tools/release/make-latest-json.py \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --assets assets --notes notes.md --out latest.json
          gh release upload "$TAG" latest.json --clobber

      # Fixed names so a website can link to /releases/latest/download/<name>.
      - name: Unversioned download copies (stable only)
        if: inputs.channel == 'stable' && !inputs.prerelease
        run: |
          cd assets
          cp ./*_x64-setup.exe Downlink_x64-setup.exe
          cp ./*_amd64.AppImage Downlink_amd64.AppImage
          cp ./*_amd64.deb Downlink_amd64.deb
          cp ./*_aarch64.dmg Downlink_aarch64.dmg
          gh release upload "$TAG" Downlink_x64-setup.exe Downlink_amd64.AppImage Downlink_amd64.deb Downlink_aarch64.dmg --clobber

      - name: Publish (dev) or leave the draft (stable)
        run: |
          if [[ "$CHANNEL" == dev ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            echo "Published dev build $TAG"
          else
            echo "All builds succeeded. $TAG is a draft release; edit the notes and publish it from GitHub."
          fi

      # Rolling `dev-channel` release: always holds the newest dev latest.json, so the dev update channel has a
      # fixed URL (.../releases/download/dev-channel/latest.json). Not called `dev`: that is the branch name.
      - name: Point the dev channel at this build
        if: inputs.channel == 'dev' && needs.prepare.outputs.signed == 'true'
        run: |
          sha="$(git rev-parse HEAD)"
          git tag -f dev-channel "$sha"
          git push -f origin refs/tags/dev-channel
          if ! gh release view dev-channel >/dev/null 2>&1; then
            gh release create dev-channel --prerelease --latest=false --target "$sha" \
              --title "Dev channel" \
              --notes "Holds the newest dev build's latest.json for the in-app dev update channel. Download builds from the vX.Y.Z-dev.N pre-releases."
          fi
          gh release upload dev-channel latest.json --clobber

      - name: Keep only the 5 newest dev builds
        if: inputs.channel == 'dev'
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "deleting old dev build $old"
            gh release delete "$old" --yes --cleanup-tag
          done

  # ---------------------------------------------------------------------------
  # A failed build must not leave a half-filled release (or its tag) behind.
  cleanup:
    name: Delete incomplete release
    needs: [prepare, build-windows, build-linux, build-macos, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (contains(fromJSON('["failure","cancelled"]'), needs.build-windows.result) || contains(fromJSON('["failure","cancelled"]'), needs.build-linux.result) || contains(fromJSON('["failure","cancelled"]'), needs.build-macos.result) || contains(fromJSON('["failure","cancelled"]'), needs.publish.result)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Only ever delete a release that is still a draft.
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo unknown)"
          if [[ "$draft" == true ]]; then
            # Drafts have no git tag yet, so no --cleanup-tag (it 422s after deleting the release).
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          fi
          echo "::error::A platform build or publish failed; removed incomplete draft release $TAG"
          exit 1
