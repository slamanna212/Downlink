# Manual dev build: builds the `dev` branch and publishes a pre-release straight away
# (vX.Y.Z-dev.<shortsha>, X.Y.Z from the root package.json), then refreshes the rolling `dev` release holding the
# dev-channel latest.json. Mirrors Apogee's dev-prerelease.yml. The `dev` branch must exist.
name: Dev prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-prerelease
  cancel-in-progress: true

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute dev version and tag
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          # Dev builds are always <base>-dev.<sha>; strip any pre-release suffix from the base first.
          BASE="${BASE%%-*}"
          VERSION="${BASE}-dev.$(git rev-parse --short=7 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if a release already exists for this tag
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI gate
    needs: check-version
    if: needs.check-version.outputs.release_exists == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      ref: dev
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}

  build:
    name: Build and publish
    needs: [check-version, ci]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      ref: dev
      version: ${{ needs.check-version.outputs.version }}
      tag: ${{ needs.check-version.outputs.tag }}
      prerelease: true
      channel: dev
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
