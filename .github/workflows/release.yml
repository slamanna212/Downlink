# Production release: publishes the version in the ROOT package.json, unless a release for that version
# already exists. Mirrors Apogee's release.yml. See docs/release.md.
# DISABLED: the push-to-main trigger is off until the owner turns it back on. Manual dispatch only.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-flight; later pushes queue behind it.
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      version: ${{ steps.package_version.outputs.version }}
      tag: ${{ steps.package_version.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.exists }}
      prerelease: ${{ steps.prerelease.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get package version
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if a release already exists for this tag
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package_version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do. Bump package.json to publish a new version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint / typecheck / tests (the full quality gates) before anything is built.
  ci:
    name: CI gate
    needs: check-version
    if: needs.check-version.outputs.release_exists == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}

  build:
    name: Build and publish
    needs: [check-version, ci]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      tag: ${{ needs.check-version.outputs.tag }}
      prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
      channel: stable
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
