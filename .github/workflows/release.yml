# Stable release: every push to main (e.g. merging dev) builds the root package.json version as a DRAFT
# release, unless a release for that version already exists, in which case the run stops after one quick check.
# You edit the notes and publish it by hand. To ship again, bump package.json. See docs/release.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # retry a failed release by hand (main only)

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-flight; later pushes queue behind it.
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_exists: ${{ steps.check_release.outputs.exists }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read package.json version
        id: v
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # A -suffix version (0.8.0-beta.1) becomes a pre-release, which the stable update channel ignores.
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - name: Check if a release already exists for this tag
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do. Bump package.json to release a new version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Tests (Linux)
    needs: check-version
    if: needs.check-version.outputs.release_exists == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}

  build:
    name: Build and publish
    needs: [check-version, ci]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      tag: ${{ needs.check-version.outputs.tag }}
      prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
      channel: stable
      linux-runner: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
