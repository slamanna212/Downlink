[package]
name = "downlink-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OS integration for Downlink: sleep/resume and quit hooks (tray, media keys, MPRIS come later)"

[lints]
workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.9"
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.9"
