# cargo-fuzz targets for the hostile-input parsers. Needs a nightly toolchain and `cargo install
# cargo-fuzz`; run from crates/downlink-core:  cargo +nightly fuzz run m3u   (or: xmltv)
# The stable-toolchain equivalent is tests/fuzz_props.rs (proptest), which runs in CI.
[package]
name = "downlink-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
downlink-core = { path = ".." }
tempfile = "3"
chrono-tz = "0.10"

# Keep this crate out of the main workspace.
[workspace]

[[bin]]
name = "m3u"
path = "fuzz_targets/m3u.rs"
test = false
doc = false

[[bin]]
name = "xmltv"
path = "fuzz_targets/xmltv.rs"
test = false
doc = false
