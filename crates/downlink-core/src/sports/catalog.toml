# Sports catalog (docs/SPORTS.md §2). Data only: roster changes never need code changes.
#
# League fields:
#   key, name, kind = "team" | "motorsport"
#   group     motorsport only: open_wheel | stock_car | sports_car | motorcycle | rally | drag_dirt
#   tokens    strong league/series names (match on their own)
#   context   risky tokens that only count when the league already has context (§2.2)
#   events    motorsport only: marquee event aliases, strong
#   exclude   phrases that veto a match for this league (talk shows, more specific series)
#
# Team fields:
#   key, name (full, strong), short (nickname), abbr, city (always weak)
#   aliases   extra strong aliases
#   weak      extra weak aliases
# A `short` that appears in more than one league is treated as weak automatically.

# Session terms (§2.3), checked in order shows, qualifying, practice, race.
[sessions]
shows = [
  "Pre-race", "Pre-Race Show", "Post-race", "Post-Race Show", "Countdown", "Grid Walk", "Hub",
  "Race Hub", "Notebook", "Highlights", "Review", "Magazine", "Inside", "Raceday", "Race Day",
  "Preview", "Weekly", "Build-up", "Weekend Warm-up", "Victory Lane", "Trackside", "Debrief",
  "Press Conference", "Drivers Parade", "Pre-Qualifying", "Post-Qualifying", "Paddock",
  "Grand Prix Sunday", "Grand Prix Saturday", "Chequered Flag", "Checkered Flag",
  "Qualifying Build-up", "Race Build-up", "Pre-Show", "Post-Show", "Weekend Preview",
  "Season Review", "Ted's Notebook", "The F1 Show", "The Grid",
]
qualifying = [
  "Qualifying", "Quali", "Q1", "Q2", "Q3", "Sprint Qualifying", "Sprint Shootout", "Pole",
  "Pole Day", "Pole Qualifying", "Pole Position", "Qualifying Session", "Qualifier", "Time Trials",
  "Time Trial", "Hyperpole", "Superpole", "Shootout", "Top 10 Shootout", "Top Ten Shootout",
  "Last Chance Qualifier", "Last Chance Qualifying", "LCQ", "Fast Six", "Fast Nine", "Fast 12",
  "Bump Day",
]
practice = [
  "Practice", "Free Practice", "Practice 1", "Practice 2", "Practice 3", "Free Practice 1",
  "Free Practice 2", "Free Practice 3", "Final Practice", "Opening Practice", "Practice Session",
  "FP1", "FP2", "FP3", "P1", "P2", "P3", "Warm-up", "Warmup", "Happy Hour", "Carb Day",
  "Shakedown", "Test", "Testing", "Open Test", "Roar Before the 24",
]
race = [
  "Race", "Grand Prix", "GP", "Sprint", "Sprint Race", "Feature", "Feature Race", "Main Race",
  "Main Event", "A-Main", "Heat", "Heat Race", "Heats", "Superpole Race", "Duel", "Duels", "Final",
  "Finals", "Eliminations", "Dash", "24 Hours", "12 Hours", "8 Hours", "6 Hours", "Hours of",
  "24 Hour", "12 Hour", "1000", "600", "500", "400", "300", "250", "200", "150", "Daytona 500",
  "Coca-Cola 600", "E-Prix", "Stage", "Power Stage", "Rally", "Moto 1", "Moto 2", "Nationals",
]
# Event names holding a session term that say nothing about the session ("Adelaide Grand Final").
neutral = ["Grand Final", "Grand Finale", "Season Final", "Season Finale"]

# Shared word lists (§5).
#   filler  placeholder listings that are never an event (veto)
#   feeds   secondary event-channel feeds that are never their own match
[words]
filler = [
  "No Game Today", "No Game Scheduled", "No Games Scheduled", "No Game", "No Games", "No Event",
  "No Events", "No Event Scheduled", "No Programming", "Off Air", "Offseason", "Off Season",
  "Programming Resumes", "Next Game", "Coming Up", "Coming Soon", "Stay Tuned", "To Be Announced",
  "Event Not Started", "Event Ended", "Off The Air",
]
feeds = [
  "On-Board", "Onboard", "On Board", "On-Board Camera", "Onboard Camera", "Driver Tracker",
  "Timing Channel", "Live Timing", "Timing", "Pit Lane", "Pit Lane Channel", "Data Channel",
